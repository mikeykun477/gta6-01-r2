<!doctype html>
<html lang="en">
<head>

<title>Port Vireo — Open-World Crime</title>

  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e1a; }

<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/boot.js"></script>
